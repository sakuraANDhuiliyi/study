# Add INSIDE the existing study.huiliyi.cn HTTPS server {}. Keep the site's other locations.
# This private same-origin route must not be forwarded straight to LiveKit's 7880 API.
location ^~ /api/live/media/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    # WebRTC SDKs carry a short-lived credential in the signaling URL.
    access_log off;
    error_log /dev/null crit;
}
