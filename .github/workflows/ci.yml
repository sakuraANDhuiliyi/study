name: build-and-verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lms:lms_local_only@127.0.0.1:55432/zhixue_review_ci?schema=public
      TEST_BASE_URL: http://127.0.0.1:3001
      TEST_API_URL: http://127.0.0.1:3001/api
      WEB_BASE_URL: http://localhost:5173
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_local_only
          POSTGRES_DB: zhixue_review_ci
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d zhixue_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - name: Install isolated native dependencies and reviewed security backports
        run: npm ci --prefix apps/mobile
      - name: Install Android Agent protocol dependencies
        run: |
          python -m venv .data/android-venv
          .data/android-venv/bin/python -m pip install --require-hashes -r services/android-agent/requirements.lock

      - run: cp .env.example .env
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium firefox webkit chrome
      - name: Start virtual audio output for real browser media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=live_verification rate=48000 channels=2
          pactl set-default-sink live_verification
          test "$(pactl get-default-sink)" = live_verification
          pactl list short sinks
      - name: Complete verification with automatic test discovery
        run: node --env-file=.env scripts/verify-iteration.mjs --profile=ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          include-hidden-files: true
          path: |
            .data/iteration-*/report.json
            .data/iteration-*/*.log
            .data/iteration-*/browser-summary.json
            .data/aora-verification/browser.json
            apps/mobile/.data/dependency-audit.json
            apps/mobile/.data/verification/*.log
            apps/mobile/.data/verification/report.json
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package requested by v3's default.
          packages: platform-tools
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci --prefix apps/mobile
      - name: Build bundled HTTPS preview APK (public debug signing key)
        run: npm run build:preview --prefix apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: zhixue-android-preview-arm64
          path: |
            apps/mobile/.data/apk/zhixue-preview-arm64.apk
            apps/mobile/.data/apk/zhixue-preview-arm64.apk.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-diagnostics
          include-hidden-files: true
          path: apps/mobile/.data/apk/*.log
