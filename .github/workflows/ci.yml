name: build-and-verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lms:lms_local_only@127.0.0.1:55432/zhixue_review_ci?schema=public
      TEST_BASE_URL: http://127.0.0.1:3001
      TEST_API_URL: http://127.0.0.1:3001/api
      WEB_BASE_URL: http://localhost:5173
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_local_only
          POSTGRES_DB: zhixue_review_ci
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U lms -d zhixue_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: cp .env.example .env
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Complete verification with automatic test discovery
        run: node --env-file=.env scripts/verify-iteration.mjs --profile=ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          include-hidden-files: true
          path: |
            .data/iteration-*/report.json
            .data/iteration-*/*.log
            .data/iteration-*/browser-summary.json
            .data/aora-verification/browser.json
